<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--branco); 
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;}
        .navbar-mk { background-color: var(--amarelo-principal); }
        .btn-outline-mk { border: 2px solid var(--amarelo-claro); color: var(--amarelo-claro); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-mk:hover { background-color: var(--amarelo-claro); color: var(--amarelo-principal); }
        .btn-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 8px 20px; }
        .btn-mk:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
        .card-mk { background-color: var(--amarelo-claro); border: none; border-radius: 16px; }
        .card-header-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border-radius: 16px 16px 0 0 !important; }
        .card-stat { background-color: var(--amarelo-claro); border: none; border-radius: 16px; }
        h2, h5 { color: var(--marrom-avermelhado); }
        .table thead { background-color: var(--amarelo-principal); color: var(--amarelo-claro); }
        .table-custom { background-color: var(--amarelo-claro); }
    </style>
</head>
<body>
<nav class="navbar navbar-mk px-4 py-3 d-flex justify-content-between align-items-center">
    <a href="/admin/dashboard" class="navbar-brand"><img src="/admin.png" style="width: 150px; height: 40px;" alt="Maktaba Admin"></a>
    <div class="d-flex gap-2">
        <a href="/livros/admin/novo" class="btn btn-outline-mk btn-sm">Novo Livro</a>
        <a href="/admin/avaliacoes" class="btn btn-outline-mk btn-sm">Avaliacoes</a>
        <a href="/livros/catalogo" class="btn btn-outline-mk btn-sm">Catálogo</a>
        <form action="/logout" method="post" class="d-inline">
            <button class="btn btn-danger-mk btn-sm">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <h2 class="fw-bold mb-4">Dashboard Administrativo</h2>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card card-stat shadow text-center p-3" style="border-left: 4px solid #28a745;">
                <h1 class="text-success" th:text="${ativas}">0</h1>
                <p class="text-muted mb-0">Assinaturas Ativas</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat shadow text-center p-3" style="border-left: 4px solid #D4A017;">
                <h1 class="text-warning" th:text="${pausadas}">0</h1>
                <p class="text-muted mb-0">Assinaturas Pausadas</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat shadow text-center p-3" style="border-left: 4px solid #A0522D;">
                <h1 class="text-danger" th:text="${canceladas}">0</h1>
                <p class="text-muted mb-0">Assinaturas Canceladas</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat shadow text-center p-3" style="border-left: 4px solid var(--amarelo-principal);">
                <h1 style="color: var(--amarelo-principal);">R$<span th:text="${faturamento}">0</span></h1>
                <p class="text-muted mb-0">Faturamento Mensal</p>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card card-stat shadow text-center p-3">
                <h1 style="color: var(--marrom-avermelhado);" th:text="${totalUsuarios}">0</h1>
                <p class="text-muted mb-0">Total de Usuarios</p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card card-stat shadow text-center p-3">
                <h1 style="color: var(--marrom-avermelhado);" th:text="${totalLivros}">0</h1>
                <p class="text-muted mb-0">Livros no Catalogo</p>
            </div>
        </div>
    </div>

    <div class="card card-mk shadow">
        <div class="card-header card-header-mk py-3">
            <h5 class="mb-0">Lista de Assinaturas</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead style="background-color: var(--amarelo-principal); color: var(--amarelo-claro);">
                <tr>
                    <th>Usuario</th>
                    <th>Plano</th>
                    <th>Status</th>
                    <th>Inicio</th>
                    <th>Renovacao</th>
                </tr>
                </thead>
                <tbody style="background-color: var(--amarelo-claro);">
                <tr th:each="assinatura : ${assinaturas}">
                    <td th:text="${assinatura.usuario.nome}"></td>
                    <td>
                        <span class="badge" style="background-color: var(--amarelo-principal);" th:text="${assinatura.plano}"></span>
                    </td>
                    <td>
                            <span class="badge"
                                  th:classappend="${assinatura.status == 'ATIVA'} ? 'bg-success' : (${assinatura.status == 'CANCELADA'} ? 'bg-danger' : 'bg-warning')"
                                  th:text="${assinatura.status}"></span>
                    </td>
                    <td th:text="${assinatura.dataInicio}"></td>
                    <td th:text="${assinatura.dataRenovacao}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

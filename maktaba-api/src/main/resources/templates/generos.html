<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus Generos - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--branco);
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;}
        .navbar-mk { background-color: var(--amarelo-principal); }
        .btn-outline-mk { border: 2px solid var(--amarelo-claro); color: var(--amarelo-claro); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-mk:hover { background-color: var(--amarelo-claro); color: var(--amarelo-principal); }
        .btn-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 10px 30px; }
        .btn-danger-mk { background-color: #c0392b; color: white; border: none; border-radius: 20px; padding: 6px 18px; }
        .btn-mk:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
        .card-mk { background-color: var(--amarelo-claro); border: none; border-radius: 20px; }
        .card-header-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border-radius: 20px 20px 0 0 !important; }
        .form-check-input:checked { background-color: var(--amarelo-principal); border-color: var(--amarelo-principal); }
        h4, h5 { color: var(--marrom-avermelhado); }
    </style>
</head>
<body>
<nav class="navbar navbar-mk px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--amarelo-claro);"><img src="/logo.png" style="width: 100px; height: 40px;" alt="Maktaba"></a>
    <a href="/perfil" class="btn btn-outline-mk btn-sm">Voltar ao Perfil</a>
</nav>

<div class="container py-5" style="max-width: 600px;">
    <div class="card card-mk shadow">
        <div class="card-header card-header-mk py-3">
            <h4 class="mb-0">Meus Generos Literarios</h4>
        </div>
        <div class="card-body p-4">
            <p class="text-muted mb-4">Escolha entre <strong>1 e 8 generos</strong> que mais combinam com voce.</p>

            <div th:if="${erro}" class="alert" style="background-color: #f8d7da; color: #721c24; border-radius: 10px;" th:text="${erro}"></div>

            <form action="/perfil/generos" method="post">
                <div class="row g-3 mb-4">
                    <div th:each="genero : ${todosGeneros}" class="col-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="generos"
                                   th:value="${genero}"
                                   th:id="${genero}"
                                   th:checked="${generosEscolhidos.contains(genero)}"
                                   onchange="validarSelecao()"/>
                            <label class="form-check-label" th:for="${genero}" th:text="${genero}"></label>
                        </div>
                    </div>
                </div>

                <div id="avisoMax" class="alert d-none" style="background-color: #fff3cd; color: #856404; border-radius: 10px;">
                    Voce pode escolher no maximo 8 generos!
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <span id="contador" class="text-muted small">0 generos selecionados</span>
                    <button type="submit" class="btn-mk">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function validarSelecao() {
        const checkboxes = document.querySelectorAll('input[name="generos"]:checked');
        const total = checkboxes.length;
        const aviso = document.getElementById('avisoMax');
        const contador = document.getElementById('contador');
        contador.textContent = total + ' genero(s) selecionado(s)';
        if (total > 8) {
            aviso.classList.remove('d-none');
        } else {
            aviso.classList.add('d-none');
        }
    }
    validarSelecao();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

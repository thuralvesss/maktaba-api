<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagamento Confirmado - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--branco);
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;}
        .navbar-mk { background-color: var(--amarelo-principal); }
        .btn-outline-mk { border: 2px solid var(--amarelo-claro); color: var(--amarelo-claro); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-mk:hover { background-color: var(--amarelo-claro); color: var(--amarelo-principal); }
        .card-mk { background-color: var(--amarelo-claro); border: none; border-radius: 20px; }
        .card-header-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border-radius: 20px 20px 0 0 !important; }
        .btn-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 10px 30px; }
        .btn-danger-mk { background-color: #c0392b; color: white; border: none; border-radius: 20px; padding: 6px 18px; }
        .btn-mk:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
        h2, h5 { color: var(--marrom-avermelhado); }
    </style>
</head>
<body>
<nav class="navbar navbar-mk px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--amarelo-claro);"><img src="/logo.png" style="width: 100px; height: 40px;" alt="Maktaba"></a>
    <div>
        <a href="/" class="btn btn-outline-mk btn-sm me-2">Home</a>
        <a href="/assinatura/status" class="btn btn-outline-mk btn-sm">Minha Assinatura</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 550px;">
    <div class="card card-mk shadow text-center">
        <div class="card-header card-header-mk py-4">
            <h3 class="mb-0">Pagamento Recebido!</h3>
        </div>
        <div class="card-body p-4">
            <div class="mb-4" style="font-size: 60px;">#10003;</div>
            <h5 class="fw-bold mb-3">Sua solicitação foi registrada</h5>
            <p class="text-muted mb-4">Assim que o pagamento for confirmado sua assinatura será ativada.</p>

            <div class="border rounded p-3 mb-4" style="background-color: var(--branco); border-radius: 12px !important;">
                <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">Plano</span>
                    <span class="fw-bold" th:text="${plano}"></span>
                </div>
                <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">Valor</span>
                    <span class="fw-bold">R$ <span th:text="${valor}"></span></span>
                </div>
                <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">Forma de pagamento</span>
                    <span class="fw-bold" th:text="${formaPagamento}"></span>
                </div>
            </div>

            <a href="/assinatura/status" class="btn btn-mk w-100">Ver minha assinatura</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --vinho: #6B0F1A;
            --bege: #E8D5A3;
            --bege-claro: #F5EDD0;
            --marrom: #3D0A0A;
        }
        body { background-color: var(--bege-claro); }
        .navbar-custom { background-color: var(--vinho); }
        .btn-vinho { background-color: var(--vinho); color: var(--bege); border: none; border-radius: 20px; padding: 8px 20px; }
        .btn-vinho:hover { background-color: var(--marrom); color: var(--bege); }
        .btn-outline-bege { border: 2px solid var(--bege); color: var(--bege); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-bege:hover { background-color: var(--bege); color: var(--vinho); }
        .card-livro { background-color: var(--bege); border: none; border-radius: 16px; transition: transform 0.2s; }
        .card-livro:hover { transform: translateY(-5px); }
        .badge-genero { background-color: var(--vinho); color: var(--bege); border-radius: 20px; padding: 4px 12px; font-size: 12px; }
        h2, h5, h6 { color: var(--marrom); }
    </style>
</head>
<body>
<nav class="navbar navbar-custom px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--bege);">Maktaba</a>
    <div>
        <a href="/" class="btn btn-outline-bege btn-sm me-2">Home</a>
        <a href="/assinatura/planos" class="btn btn-outline-bege btn-sm me-2">Assinar</a>
        <a href="/perfil" class="btn btn-outline-bege btn-sm">Meu Perfil</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"> Catálogo de Livros</h2>
        <a href="/livros/admin/novo" class="btn btn-vinho">+ Adicionar Livro</a>
    </div>

    <div class="row g-4">
        <div th:each="livro : ${livros}" class="col-md-3 col-sm-6">
            <div class="card card-livro shadow h-100">
                <img th:src="${livro.imagemUrl != null and !#strings.isEmpty(livro.imagemUrl)}
              ? ${livro.imagemUrl}
              : 'https://via.placeholder.com/200x280?text=Sem+Capa'"
                     th:alt="${livro.titulo}"
                     class="card-img-top"
                     style="height: 280px; object-fit: cover; border-radius: 16px 16px 0 0;" />
                <div class="card-body">
                    <h6 class="card-title fw-bold" th:text="${livro.titulo}"></h6>
                    <p class="card-text text-muted small mb-2" th:text="${livro.autor}"></p>
                    <span class="badge-genero" th:text="${livro.genero}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

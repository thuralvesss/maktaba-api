<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--amarelo-principal); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card-custom { background-color: var(--amarelo-claro); border-radius: 20px; padding: 40px; width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .form-control { background-color: var(--branco); border: none; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .form-control:focus { background-color: var(--branco); border: 2px solid var(--amarelo-principal); box-shadow: none; }
        .btn-vinho { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 10px 40px; font-size: 16px; width: 100%; }
        .btn-vinho:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
        h2 { color: var(--marrom-avermelhado); }
    </style>
</head>
<body>
<div class="card-custom">
    <h2 class="fw-bold mb-4">Nova Senha</h2>

    <div th:if="${sucesso}" class="alert mb-3" style="background-color: #d4edda; color: #155724; border-radius: 10px;">
        <p th:text="${sucesso}" class="mb-2"></p>
        <a href="/usuarios/login" style="color: #155724; font-size: 14px;">Ir para o login</a>
    </div>

    <div th:if="${erro}" class="alert mb-3" style="background-color: #f8d7da; color: #721c24; border-radius: 10px;" th:text="${erro}"></div>

    <form th:unless="${sucesso}" action="/recuperar-senha/redefinir" method="post">
        <input type="hidden" name="token" th:value="${token}"/>
        <input type="password" name="novaSenha" class="form-control" placeholder="Nova senha" required/>
        <input type="password" class="form-control" placeholder="Confirmar senha" required/>
        <button type="submit" class="btn-vinho">Redefinir senha</button>
    </form>

    <p th:unless="${sucesso}" class="text-center mt-3 mb-0">
        <a href="/usuarios/login" style="color: var(--amarelo-principal); text-decoration: none; font-size: 14px;">Voltar para o login</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Maktaba - Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--amarelo-principal); min-height: 100vh; display: flex; }
        .lado-esquerdo { background-color: var(--amarelo-principal); color: var(--amarelo-claro); width: 300px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        .lado-direito { background-color: var(--branco);
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center; }
        .card-cadastro { background-color: var(--amarelo-claro); border-radius: 20px; padding: 40px; width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .form-control { background-color: var(--branco); border: none; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .form-control:focus { background-color: var(--branco); border: 2px solid var(--amarelo-principal); box-shadow: none; }
        .btn-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 10px 40px; font-size: 16px; }
        .btn-danger-mk { background-color: #c0392b; color: white; border: none; border-radius: 20px; padding: 6px 18px; }
        .btn-mk:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
        .logo { font-size: 28px; font-weight: bold; color: var(--amarelo-claro); margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="lado-esquerdo">
    <div class="logo"><img src="/logo.png" style="width: 250px; height: 100px;" alt="Maktaba"></div>
    <p class="text-center" style="color: var(--amarelo-claro);">Junte-se ao Maktaba e descubra novos livros todo mês!</p>
</div>

<div class="lado-direito">
    <div class="card-cadastro">
        <h2 class="fw-bold mb-4" style="color: var(--marrom-avermelhado);">Realize seu cadastro</h2>

        <form action="/usuarios/registrar" method="post">
            <input type="text" name="nome" class="form-control" placeholder="Nome completo" required/>
            <input type="text" name="username" class="form-control" placeholder="Nome de usuário" required/>
            <input type="email" name="email" class="form-control" placeholder="E-mail" required/>
            <input type="date" name="dataNascimento" class="form-control" required/>
            <input type="password" name="senhaHash" class="form-control" placeholder="Senha" required/>
            <div class="text-center mt-3">
                <button type="submit" class="btn btn-mk">Cadastrar-se</button>
            </div>
        </form>

        <p class="text-center mt-3 mb-0">
            <a href="/usuarios/login" style="color: var(--amarelo-principal); text-decoration: none; font-size: 14px;">Já tem conta? Entrar</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --vinho: #6B0F1A;
            --bege: #E8D5A3;
            --bege-claro: #F5EDD0;
            --marrom: #3D0A0A;
        }
        body { background-color: var(--bege-claro); }
        .navbar-custom { background-color: var(--vinho); }
        .btn-vinho { background-color: var(--vinho); color: var(--bege); border: none; border-radius: 20px; padding: 8px 20px; }
        .btn-vinho:hover { background-color: var(--marrom); color: var(--bege); }
        .btn-outline-bege { border: 2px solid var(--bege); color: var(--bege); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-bege:hover { background-color: var(--bege); color: var(--vinho); }
        .card-custom { background-color: var(--bege); border: none; border-radius: 16px; }
        .card-header-custom { background-color: var(--vinho); color: var(--bege); border-radius: 16px 16px 0 0 !important; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background-color: var(--vinho); display: flex; align-items: center; justify-content: center; color: var(--bege); font-size: 32px; margin: 0 auto 15px; }
        h4, h5 { color: var(--marrom); }
        .badge-ativa { background-color: #28a745; }
        .badge-cancelada { background-color: #dc3545; }
        .badge-pausada { background-color: #ffc107; color: #333; }
    </style>
</head>
<body>
<nav class="navbar navbar-custom px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--bege);">Maktaba</a>
    <div>
        <a href="/" class="btn btn-outline-bege btn-sm me-2">Home</a>
        <a href="/livros/catalogo" class="btn btn-outline-bege btn-sm me-2">Catálogo</a>
        <a href="/assinatura/planos" class="btn btn-outline-bege btn-sm">Planos</a>
    </div>
</nav>

<div class="container py-4" style="max-width: 600px;">

    <!-- Avatar e nome -->
    <div class="card card-custom shadow mb-4 text-center p-4">
        <div class="avatar">👤</div>
        <h4 class="fw-bold" th:text="${usuario.nome}"></h4>
        <p class="text-muted mb-0" th:text="'@' + ${usuario.username}"></p>
    </div>

    <!-- Dados pessoais -->
    <div class="card card-custom shadow mb-4">
        <div class="card-header card-header-custom fw-bold"> Meus Dados</div>
        <div class="card-body">
            <div class="row py-2 border-bottom">
                <div class="col text-muted">Email</div>
                <div class="col text-end fw-bold" th:text="${usuario.email}"></div>
            </div>
            <div class="row py-2 border-bottom">
                <div class="col text-muted">Data de Nascimento</div>
                <div class="col text-end fw-bold" th:text="${usuario.dataNascimento}"></div>
            </div>
            <div class="row py-2">
                <div class="col text-muted">Interesses</div>
                <div class="col text-end">
                    <span th:text="${usuario.interessesLiterarios ?: 'Não informado'}"></span>
                    <br/>
                    <a href="/perfil/generos" class="btn btn-vinho btn-sm mt-1">️ Editar Gêneros</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Assinatura -->
    <div class="card card-custom shadow mb-4">
        <div class="card-header card-header-custom fw-bold">Minha Assinatura</div>
        <div class="card-body">
            <div th:if="${assinatura}">
                <div class="row py-2 border-bottom">
                    <div class="col text-muted">Plano</div>
                    <div class="col text-end fw-bold" th:text="${assinatura.plano}"></div>
                </div>
                <div class="row py-2 border-bottom">
                    <div class="col text-muted">Status</div>
                    <div class="col text-end">
                            <span class="badge"
                                  th:classappend="${assinatura.status == 'ATIVA'} ? 'badge-ativa' : (${assinatura.status == 'CANCELADA'} ? 'badge-cancelada' : 'badge-pausada')"
                                  th:text="${assinatura.status}"></span>
                    </div>
                </div>
                <div class="row py-2">
                    <div class="col text-muted">Renovação</div>
                    <div class="col text-end fw-bold" th:text="${assinatura.dataRenovacao}"></div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <a href="/assinatura/planos" class="btn btn-vinho btn-sm">Trocar Plano</a>
                    <form action="/assinatura/cancelar" method="post" class="d-inline">
                        <button class="btn btn-sm" style="background-color: #dc3545; color: white; border-radius: 20px;">Cancelar</button>
                    </form>
                </div>
            </div>
            <div th:unless="${assinatura}">
                <p class="text-muted">Você não possui assinatura ativa.</p>
                <a href="/assinatura/planos" class="btn btn-vinho btn-sm">Ver Planos</a>
            </div>
        </div>
    </div>

    <!-- Sair -->
    <div class="text-center">
        <form action="/logout" method="post">
            <button class="btn" style="background-color: #dc3545; color: white; border-radius: 20px; padding: 10px 30px;">Sair da conta</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

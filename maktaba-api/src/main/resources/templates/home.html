<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Maktaba - Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--branco);
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;}
        .navbar-custom { background-color: var(--amarelo-principal); }
        .btn-vinho { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 8px 20px; }
        .btn-vinho:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
        .btn-outline-bege { border: 2px solid var(--amarelo-claro); color: var(--amarelo-claro); border-radius: 20px; padding: 8px 20px; background: transparent; }
        .btn-outline-bege:hover { background-color: var(--amarelo-claro); color: var(--amarelo-principal); }
        .hero { background-color: var(--amarelo-principal); color: var(--amarelo-claro); }
        .card-custom { background-color: var(--amarelo-claro); border: none; border-radius: 16px; }
        h1, h2, h3, h5 { color: var(--marrom-avermelhado); }
        .hero h1, .hero p { color: var(--amarelo-claro); }
    </style>
</head>
<body>
<nav class="navbar navbar-custom px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--amarelo-claro);"><img src="/logo.png" style="width: 100px; height: 40px;" alt="Maktaba"></a>
    <div>
        <a href="/livros/catalogo" class="btn btn-outline-bege btn-sm me-2">Catálogo</a>
        <a href="/assinatura/planos" class="btn btn-outline-bege btn-sm me-2">Assinar</a>
        <a href="/perfil" class="btn btn-outline-bege btn-sm me-2">Meu Perfil</a>
        <a href="/admin/dashboard" class="btn btn-sm me-2" style="background-color: var(--amarelo-claro); color: var(--amarelo-principal); border-radius: 20px;"> Admin</a>
        <form action="/logout" method="post" class="d-inline">
            <button class="btn btn-sm" style="background-color: #A0522D; color: white; border-radius: 20px;">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <div class="row g-4 justify-content-center">
        <div class="col-md-3">
            <div class="card card-custom shadow text-center p-4 h-100">
                <h1></h1>
                <h5 class="fw-bold mt-2">Catálogo</h5>
                <p class="text-muted">Explore nossos livros disponíveis</p>
                <a href="/livros/catalogo" class="btn btn-vinho mt-auto">Acessar</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-custom shadow text-center p-4 h-100">
                <h1></h1>
                <h5 class="fw-bold mt-2">Assinatura</h5>
                <p class="text-muted">Escolha seu plano de leitura</p>
                <a href="/assinatura/planos" class="btn btn-vinho mt-auto">Ver Planos</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-custom shadow text-center p-4 h-100">
                <h1></h1>
                <h5 class="fw-bold mt-2">Leituras</h5>
                <p class="text-muted">Acompanhe seu progresso</p>
                <a href="/leitura" class="btn btn-vinho mt-auto">Acessar</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-custom shadow text-center p-4 h-100">
                <h1></h1>
                <h5 class="fw-bold mt-2">Perfil</h5>
                <p class="text-muted">Gerencie seus dados</p>
                <a href="/perfil" class="btn btn-vinho mt-auto">Acessar</a>
            </div>
        </div>
    </div>
</div>

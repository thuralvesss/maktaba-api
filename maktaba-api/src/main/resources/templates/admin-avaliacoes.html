<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Avaliacoes - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --vinho: #6B0F1A;
            --bege: #E8D5A3;
            --bege-claro: #F5EDD0;
            --marrom: #3D0A0A;
        }
        body { background-color: var(--bege-claro); }
        .navbar-custom { background-color: var(--vinho); }
        .btn-outline-bege { border: 2px solid var(--bege); color: var(--bege); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-bege:hover { background-color: var(--bege); color: var(--vinho); }
        .card-custom { background-color: var(--bege); border: none; border-radius: 16px; }
        .card-header-custom { background-color: var(--vinho); color: var(--bege); border-radius: 16px 16px 0 0 !important; }
        .estrela { color: #ffc107; }
        .table thead { background-color: var(--vinho); color: var(--bege); }
        .table tbody { background-color: var(--bege); }
        h2, h5 { color: var(--marrom); }
    </style>
</head>
<body>
<nav class="navbar navbar-custom px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--bege);">Maktaba — Admin</a>
    <div>
        <a href="/admin/dashboard" class="btn btn-outline-bege btn-sm me-2">Dashboard</a>
        <form action="/logout" method="post" class="d-inline">
            <button class="btn btn-sm" style="background-color: #dc3545; color: white; border-radius: 20px;">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <h2 class="fw-bold mb-4">Gerenciar Avaliacoes</h2>

    <div class="card card-custom shadow">
        <div class="card-header card-header-custom py-3">
            <h5 class="mb-0">Avaliacoes dos usuarios</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Livro</th>
                    <th>Nota</th>
                    <th>Comentario</th>
                    <th>Data</th>
                    <th>Acao</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="avaliacao : ${avaliacoes}">
                    <td th:text="${avaliacao.usuario.nome}"></td>
                    <td th:text="${avaliacao.livro.titulo}"></td>
                    <td>
                        <span class="estrela" th:text="${avaliacao.nota} + ' estrela(s)'"></span>
                    </td>
                    <td th:text="${avaliacao.comentario}"></td>
                    <td th:text="${#temporals.format(avaliacao.dataAvaliacao, 'dd/MM/yyyy')}"></td>
                    <td>
                        <form th:action="'/avaliacoes/remover/' + ${avaliacao.id}" method="post">
                            <button class="btn btn-sm" style="background-color: #dc3545; color: white; border-radius: 20px;">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

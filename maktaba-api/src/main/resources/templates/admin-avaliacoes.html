<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Avaliacoes - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--branco);
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;}
        .navbar-mk { background-color: var(--amarelo-principal); }
        .btn-outline-mk { border: 2px solid var(--amarelo-claro); color: var(--amarelo-claro); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-mk:hover { background-color: var(--amarelo-claro); color: var(--amarelo-principal); }
        .card-mk { background-color: var(--amarelo-claro); border: none; border-radius: 16px; }
        .card-header-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border-radius: 16px 16px 0 0 !important; }
        .estrela { color: #ffc107; }
        .table thead { background-color: var(--amarelo-principal); color: var(--amarelo-claro); }
        .table tbody { background-color: var(--amarelo-claro); }
        h2, h5 { color: var(--marrom-avermelhado); }
    </style>
</head>
<body>
<nav class="navbar navbar-mk px-4 py-3 d-flex justify-content-between align-items-center">
    <a href="/admin/dashboard" class="navbar-brand"><img src="/admin.png" style="width: 150px; height: 40px;" alt="Maktaba Admin"></a>
    <div class="d-flex gap-2">
        <a href="/admin/dashboard" class="btn btn-outline-mk btn-sm">Dashboard</a>
        <a href="/livros/admin/novo" class="btn btn-outline-mk btn-sm">Novo Livro</a>
        <form action="/logout" method="post" class="d-inline">
            <button class="btn btn-danger-mk btn-sm">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <h2 class="fw-bold mb-4">Gerenciar Avaliacoes</h2>

    <div class="card card-mk shadow">
        <div class="card-header card-header-mk py-3">
            <h5 class="mb-0">Avaliacoes dos usuarios</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Livro</th>
                    <th>Nota</th>
                    <th>Comentario</th>
                    <th>Data</th>
                    <th>Acao</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="avaliacao : ${avaliacoes}">
                    <td th:text="${avaliacao.usuario.nome}"></td>
                    <td th:text="${avaliacao.livro.titulo}"></td>
                    <td>
                        <span class="estrela" th:text="${avaliacao.nota} + ' estrela(s)'"></span>
                    </td>
                    <td th:text="${avaliacao.comentario}"></td>
                    <td th:text="${#temporals.format(avaliacao.dataAvaliacao, 'dd/MM/yyyy')}"></td>
                    <td>
                        <form th:action="'/avaliacoes/remover/' + ${avaliacao.id}" method="post">
                            <button class="btn btn-sm" style="background-color: #dc3545; color: white; border-radius: 20px;">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

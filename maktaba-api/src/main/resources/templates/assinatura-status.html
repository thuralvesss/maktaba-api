<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minha Assinatura - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --vinho: #6B0F1A;
            --bege: #E8D5A3;
            --bege-claro: #F5EDD0;
            --marrom: #3D0A0A;
        }
        body { background-color: var(--bege-claro); }
        .navbar-custom { background-color: var(--vinho); }
        .btn-outline-bege { border: 2px solid var(--bege); color: var(--bege); border-radius: 20px; padding: 6px 16px; background: transparent; }
        .btn-outline-bege:hover { background-color: var(--bege); color: var(--vinho); }
        .btn-vinho { background-color: var(--vinho); color: var(--bege); border: none; border-radius: 20px; padding: 10px 24px; }
        .btn-vinho:hover { background-color: var(--marrom); color: var(--bege); }
        .card-custom { background-color: var(--bege); border: none; border-radius: 20px; }
        .card-header-custom { background-color: var(--vinho); color: var(--bege); border-radius: 20px 20px 0 0 !important; }
        .badge-ativa { background-color: #28a745; }
        .badge-pausada { background-color: #ffc107; color: #333; }
        .badge-cancelada { background-color: #dc3545; }
        h2, h5 { color: var(--marrom); }
    </style>
</head>
<body>
<nav class="navbar navbar-custom px-4 py-3">
    <a class="navbar-brand fw-bold fs-4" style="color: var(--bege);">Maktaba</a>
    <div>
        <a href="/" class="btn btn-outline-bege btn-sm me-2">Home</a>
        <a href="/livros/catalogo" class="btn btn-outline-bege btn-sm">Catalogo</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 500px;">
    <div class="card card-custom shadow text-center">
        <div class="card-header card-header-custom py-3">
            <h4 class="mb-0">Minha Assinatura</h4>
        </div>
        <div class="card-body p-4">
            <div th:if="${assinatura}">
                <span class="badge mb-3 fs-6"
                      th:classappend="${assinatura.status == 'ATIVA'} ? 'badge-ativa' : (${assinatura.status == 'CANCELADA'} ? 'badge-cancelada' : 'badge-pausada')"
                      th:text="${assinatura.status}"></span>
                <div class="border rounded p-3 mb-4" style="background-color: var(--bege-claro); border-radius: 12px !important; text-align: left;">
                    <div class="d-flex justify-content-between py-1 border-bottom">
                        <span class="text-muted">Plano</span>
                        <span class="fw-bold" th:text="${assinatura.plano}"></span>
                    </div>
                    <div class="d-flex justify-content-between py-1 border-bottom">
                        <span class="text-muted">Inicio</span>
                        <span class="fw-bold" th:text="${assinatura.dataInicio}"></span>
                    </div>
                    <div class="d-flex justify-content-between py-1">
                        <span class="text-muted">Renovacao</span>
                        <span class="fw-bold" th:text="${assinatura.dataRenovacao}"></span>
                    </div>
                </div>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="/assinatura/planos" class="btn btn-vinho">Trocar Plano</a>
                    <form action="/assinatura/cancelar" method="post" class="d-inline">
                        <button class="btn" style="background-color: #dc3545; color: white; border-radius: 20px; padding: 10px 24px;">Cancelar</button>
                    </form>
                </div>
            </div>
            <div th:unless="${assinatura}">
                <p class="text-muted mb-3">Voce nao possui assinatura ativa.</p>
                <a href="/assinatura/planos" class="btn btn-vinho">Ver Planos</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Livro - Maktaba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --amarelo-principal: #D4A017;
            --amarelo-claro: #FFF4CC;
            --branco: #FFFFFF;
            --marrom-avermelhado: #8B4513;
        }
        body { background-color: var(--branco);
                background-image: url('/bg.png');
                background-repeat: repeat;
                background-size: 800px;}
        .navbar-mk { background-color: var(--amarelo-principal); }
        .card-mk { background-color: var(--amarelo-claro); border: none; border-radius: 16px; }
        .card-header-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border-radius: 16px 16px 0 0 !important; }
        .form-control { background-color: var(--branco); border: 1px solid #ccc; border-radius: 10px; }
        .form-control:focus { border-color: var(--amarelo-principal); box-shadow: none; }
        .btn-mk { background-color: var(--amarelo-principal); color: var(--amarelo-claro); border: none; border-radius: 20px; padding: 10px 30px; }
        .btn-mk:hover { background-color: var(--marrom-avermelhado); color: var(--amarelo-claro); }
    </style>
</head>
<body>
<nav class="navbar navbar-mk px-4 py-3 d-flex justify-content-between align-items-center">
    <a href="/admin/dashboard" class="navbar-brand"><img src="/admin.png" style="width: 150px; height: 40px;" alt="Maktaba Admin"></a>
    <div class="d-flex gap-2">
        <a href="/admin/dashboard" class="btn btn-outline-mk btn-sm">Dashboard</a>
        <a href="/livros/catalogo" class="btn btn-outline-mk btn-sm">Catálogo</a>
        <form action="/logout" method="post" class="d-inline">
            <button class="btn btn-danger-mk btn-sm">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-4" style="max-width: 600px;">
    <div class="card card-mk shadow">
        <div class="card-header card-header-mk fw-bold">
             Adicionar Novo Livro
        </div>
        <div class="card-body p-4">
            <form action="/livros/admin/salvar" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Título</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Título do livro" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Autor</label>
                    <input type="text" name="autor" class="form-control" placeholder="Nome do autor" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Gênero</label>
                    <input type="text" name="genero" class="form-control" placeholder="Ex: Fantasia, Romance..." required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Total de Páginas</label>
                    <input type="number" name="totalPaginas" class="form-control" placeholder="Ex: 350" min="1" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">URL da Capa</label>
                    <input type="text" name="imagemUrl" class="form-control" placeholder="https://..."/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Descrição</label>
                    <textarea name="descricao" class="form-control" rows="3" placeholder="Descrição do livro"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold"> Arquivo PDF</label>
                    <input type="file" name="arquivo" class="form-control" accept=".pdf"/>
                    <small class="text-muted">Tamanho máximo: 50MB</small>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-mk">Salvar Livro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
